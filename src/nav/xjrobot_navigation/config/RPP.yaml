# ======================= xjrobot Nav2 FastLIO 实机导航配置 =======================
# 用途：
# - 定位来源：FAST_LIO_LOCALIZATION2
# - 导航入口：navigation_expr.launch.py
# - 障碍物观测：ground_segmentation -> pointcloud_to_laserscan -> /scan
#
# 关键 TF 语义：
# - 定位内部链：map_fastlio -> odom_fastlio -> base_link_fastlio
# - 对外导航链：map -> odom -> base_footprint -> base_link
# - Nav2 统一使用 base_footprint 作为平面机器人基准帧，尽量隔离 3D 姿态扰动
#
# 关键话题：
# - /map：全局地图
# - /odom：导航里程计
# - /scan：供 costmap 使用的 2D LaserScan
# - /cmd_vel_nav：Nav2 原始控制输出
# - /cmd_vel_smoothed：速度平滑后的中间输出
# - /cmd_vel_safe：最终下发到底盘的安全速度
# ===============================================================================

# 行为树导航器：串联规划、跟踪、恢复等导航动作
bt_navigator:
  ros__parameters:
    global_frame: map         # Nav2 全局参考系
    robot_base_frame: base_footprint
    odom_topic: /odom                    # 控制与局部规划依赖的里程计
    bt_loop_duration: 10                 # 行为树循环周期，ms
    default_server_timeout: 20           # action/service 默认超时，s
    wait_for_service_timeout: 1000       # 等待服务可用超时，ms
    action_server_result_timeout: 900.0  # 等待 action 结果超时，s
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 使用本包自定义恢复行为树：
    # - 保留清 costmap、重新规划、原地旋转、等待等恢复动作。
    # - 删除默认 BT 中的 BackUp 节点，恢复时不再主动后退。
    # - 旋转速度由 behavior_server 的 max/min_rotational_vel 与 rotational_acc_lim 控制。
    default_nav_to_pose_bt_xml: "$(find-pkg-share xjrobot_navigation)/behavior_trees/navigate_to_pose_no_backup.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share xjrobot_navigation)/behavior_trees/navigate_through_poses_no_backup.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# 控制器：跟踪路径并输出底盘速度
controller_server:
  ros__parameters:
    controller_frequency: 20.0           # 控制频率，Hz
    costmap_update_timeout: 0.30         # 等待代价地图更新超时，s
    min_x_velocity_threshold: 0.001      # 小于此值的 vx 视作 0
    min_y_velocity_threshold: 0.5        # 差速底盘不使用 y 向速度
    min_theta_velocity_threshold: 0.001  # 小于此值的角速度视作 0
    failure_tolerance: 1.0               # 控制失败容忍阈值
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5      # 指定时间内至少移动这么远才算有进展
      movement_time_allowance: 10.0      # 允许停滞时间，s

    general_goal_checker:
      stateful: True                     # 到点后保持状态，减少振荡
      plugin: "nav2_controller::SimpleGoalChecker"
      # 到点容差收紧：xy 0.25->0.10 m、yaw 0.15->0.05 rad，改善“到达目标点后旋转过头/停不准”
      xy_goal_tolerance: 0.15            # 平面位置容差，m
      yaw_goal_tolerance: 0.08           # 朝向容差，rad

    FollowPath:
      # 采用 RotationShim + RPP 组合控制器
      plugin: "nav2_rotation_shim_controller::RotationShimController"  # 外层控制器：路径起步前先做朝向对齐
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"  # 内层控制器：RPP 路径跟踪
      closed_loop: false
      angular_dist_threshold: 0.785      # 偏航过大时先原地转向
      angular_disengage_threshold: 0.3925 # 朝向误差小于该值后切回 RPP 跟踪
      forward_sampling_distance: 0.5     # 沿路径向前采样用于估计目标朝向的距离，m
      rotate_to_heading_angular_vel: 0.3 # 原地对齐路径朝向时的角速度，rad/s（0.7->0.3，减慢末端旋转避免旋转过头）
      max_angular_accel: 1.5             # 原地对齐时允许的最大角加速度，rad/s^2
      simulate_ahead_time: 1.0           # 旋转前向碰撞仿真时间，s
      rotate_to_goal_heading: true       # 到达目标位置后是否再对齐目标朝向
      rotate_to_heading_once: true       # 每个新目标只在起步时执行一次朝向对齐
      use_path_orientations: false       # 是否使用路径点自带朝向作为对齐参考
      desired_linear_vel: 0.3            # 巡航线速度，m/s
      lookahead_dist: 0.6                # 前视距离，m
      min_lookahead_dist: 0.3            # 速度缩放前视距离的最小值，m
      max_lookahead_dist: 0.9            # 速度缩放前视距离的最大值，m
      lookahead_time: 1.5                # 按速度计算前视距离时的时间系数，s
      transform_tolerance: 0.1           # TF 容忍延迟，s
      use_velocity_scaled_lookahead_dist: false # 是否按当前速度动态调整前视距离
      min_approach_linear_velocity: 0.08 # 接近目标时允许的最小线速度，m/s
      approach_velocity_scaling_dist: 0.6 # 距目标多远开始按距离降速，m
      use_collision_detection: false      # 控制器内部碰撞检查
      max_allowed_time_to_collision_up_to_carrot: 0.6 # 碰撞检测向前预测的最长时间，s
      use_regulated_linear_velocity_scaling: true # 是否根据路径曲率自动降速
      use_cost_regulated_linear_velocity_scaling: true # 是否根据障碍物代价自动降速
      cost_scaling_dist: 0.25
      cost_scaling_gain: 0.7
      regulated_linear_scaling_min_radius: 0.9 # 小于该转弯半径时触发曲率降速，m
      regulated_linear_scaling_min_speed: 0.08 # 曲率/代价降速后的最低线速度，m/s
      use_fixed_curvature_lookahead: false # 是否使用固定前视距离计算曲率
      curvature_lookahead_dist: 0.6       # 曲率计算使用的前视距离，m
      use_rotate_to_heading: false         # RPP 内部是否允许原地转向对齐路径
      allow_reversing: false             # 当前不允许倒车
      rotate_to_heading_min_angle: 0.785 # RPP 触发原地转向的最小角度差，rad
      max_robot_pose_search_dist: 10.0   # 在路径上搜索机器人最近点的最大距离，m
      stateful: true                     # 到达 XY 容差后保持目标状态，减少末端振荡

# 局部代价地图：滚动窗口，服务于局部避障与控制
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0             # 更新频率，Hz
      publish_frequency: 10.0            # 发布频率，Hz
      global_frame: odom                 # 局部图挂在 odom 下，避免 map 抖动影响控制
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5                           # 局部地图宽度，m
      height: 5                          # 局部地图高度，m
      resolution: 0.05                  # 分辨率，m/cell
      # 改为圆形底盘模型：由 robot_radius 决定碰撞轮廓
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0         # 膨胀代价衰减速度
        inflation_radius: 0.28           # 障碍膨胀半径，m
      obstacle_layer:
        # 本地障碍物输入统一来自 /scan
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True # 清除机器人足迹内部障碍
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          observation_persistence: 2.0
          tf_filter_tolerance: 0.3
          marking: True
          clearing: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      always_send_full_costmap: True     # 始终发布完整 costmap

# 全局代价地图：静态地图 + 实时障碍
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0              # 全局图更新频率通常低于局部图
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true          # 保留未知区域
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        # 全局图同样使用 /scan 作为实时障碍输入
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        min_obstacle_height: -1.0
        max_obstacle_height: 2.0
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          observation_persistence: 2.0
          marking: True
          clearing: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True  # 兼容 map_server 的 transient_local QoS
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0         # 膨胀代价衰减速度
        inflation_radius: 0.50           # 障碍膨胀半径，m
      always_send_full_costmap: True

# 地图保存器：运行时保存地图
map_saver:
  ros__parameters:
    save_map_timeout: 5.0                # 保存地图超时，s
    free_thresh_default: 0.25            # 自由空间阈值
    occupied_thresh_default: 0.65        # 占用空间阈值
    map_subscribe_transient_local: True

# 全局规划器：依据全局代价地图求路径
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0     # 期望规划频率，Hz，用于诊断规划器是否过慢
    planner_plugins: ["GridBased"]       # 注册的全局规划器插件名列表
    costmap_update_timeout: 1.0          # 规划前等待 global_costmap 更新的超时时间，s
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"  # 使用 NavFn 栅格全局规划器
      tolerance: 0.5                     # 目标点附近允许落到最近可达点的距离，m
      use_astar: false                   # false 为 Dijkstra，true 为 A*
      allow_unknown: false               # 是否允许路径穿越未知区域

# 平滑器：对规划路径做轻量平滑
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# 恢复行为服务器：负责原地转向、后退、等待等恢复动作
#
# 当前策略：使用自定义 BT 保留恢复流程，但删除 BackUp 节点，并把原地旋转速度调低。
# 这里仍保留 backup 插件注册，方便后续手动调试或切回默认 BT；当前自定义 BT 不会调用它。
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame:  odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.35             # 恢复原地转最大角速度，rad/s；默认 1.0，实机更温和
    min_rotational_vel: 0.15             # 恢复原地转最小角速度，rad/s；过低可能转不动
    rotational_acc_lim: 0.8              # 恢复原地转角加速度限制，rad/s^2；降低突变

# 路点跟随器：用于多目标点导航
waypoint_follower:
  ros__parameters:
    loop_rate: 20                        # 路点处理循环频率，Hz
    stop_on_failure: false               # 单点失败后是否整体终止
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200       # 到点后停留时间，ms

# 速度平滑器：对控制器输出速度做限幅与滤波
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0            # 平滑频率，Hz
    scale_velocities: False
    feedback: "OPEN_LOOP"                # 开环速度平滑
    max_velocity: [0.3, 0.0, 1.0]        # 最大速度 [vx, vy, wz]
    min_velocity: [0.0, 0.0, -1.0]       # 最小速度 [vx, vy, wz]；vx=0.0 作为额外安全阀，禁止向后输出
    max_accel: [0.5, 0.0, 1.2]           # 最大加速度
    max_decel: [-0.8, 0.0, -1.8]         # 最大减速度
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]   # 死区速度
    velocity_timeout: 1.0                # 超时未收到速度则置零

# 碰撞监视器：控制链末端的最后一道安全限制
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: "cmd_vel_smoothed" # 输入为速度平滑器输出
    cmd_vel_out_topic: "cmd_vel_safe"    # 最终安全速度输出，供底盘控制节点订阅
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.8
      simulation_time_step: 0.05
      min_points: 8
      visualize: False
      enabled: True
    observation_sources: ["obstacle_points"]
    obstacle_points:
      # 保持与 costmap 一致，统一消费 /scan
      type: "scan"
      topic: /scan
      enabled: True

# 停靠服务：当前沿用模板参数
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

# loopback_simulator：保留 Nav2 自带测试/模拟接口所需参数
loopback_simulator:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    map_frame_id: map
    # 这里使用 3D 雷达安装帧
    scan_frame_id: "lidar_3d_link"
    update_duration: 0.02
