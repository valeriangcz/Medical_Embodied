# ======================= xjrobot Nav2 FastLIO 实机导航 MPPI 新配置 =======================
# 用途：
# - 定位来源：FAST_LIO_LOCALIZATION2
# - 导航入口：navigation_mppinew.launch.py
# - 障碍物观测：ground_segmentation -> pointcloud_to_laserscan -> /scan
#
# 关键 TF 语义：
# - 定位内部链：map_fastlio -> odom_fastlio -> base_link_fastlio
# - 对外导航链：map -> odom -> base_footprint -> base_link
# - Nav2 统一使用 base_footprint 作为平面机器人基准帧，尽量隔离 3D 姿态扰动
#
# 关键话题：
# - /map：全局地图
# - /odom：导航里程计
# - /scan：供 costmap 使用的 2D LaserScan
# - /cmd_vel_nav：Nav2 原始控制输出
# - /cmd_vel_smoothed：速度平滑后的中间输出
# - /cmd_vel_safe：最终下发到底盘的安全速度
# ===============================================================================

# 行为树导航器：串联规划、跟踪、恢复等导航动作
bt_navigator:
  ros__parameters:
    global_frame: map         # Nav2 全局参考系
    robot_base_frame: base_footprint
    odom_topic: /odom                    # 控制与局部规划依赖的里程计
    bt_loop_duration: 10                 # 行为树循环周期，ms
    default_server_timeout: 20           # action/service 默认超时，s
    wait_for_service_timeout: 1000       # 等待服务可用超时，ms
    action_server_result_timeout: 900.0  # 等待 action 结果超时，s
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 使用本包自定义恢复行为树：
    # - 保留清 costmap、重新规划、原地旋转、等待等恢复动作。
    # - 删除默认 BT 中的 BackUp 节点，恢复时不再主动后退。
    # - 旋转速度由 behavior_server 的 max/min_rotational_vel 与 rotational_acc_lim 控制。
    default_nav_to_pose_bt_xml: "$(find-pkg-share xjrobot_navigation)/behavior_trees/navigate_to_pose_no_backup.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share xjrobot_navigation)/behavior_trees/navigate_through_poses_no_backup.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# 控制器：MPPI 在局部代价地图中采样多条轨迹，兼顾路径跟随、动态避障和窄空间通过
controller_server:
  ros__parameters:
    controller_frequency: 20.0           # 控制频率，Hz
    costmap_update_timeout: 0.30         # 等待代价地图更新超时，s
    min_x_velocity_threshold: 0.001      # 小于此值的 vx 视作 0
    min_y_velocity_threshold: 0.5        # 差速底盘不使用 y 向速度
    min_theta_velocity_threshold: 0.001  # 小于此值的角速度视作 0
    failure_tolerance: 2.0               # 控制失败容忍阈值，给 MPPI 短时重采样留空间
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15     # 指定时间内至少移动这么远才算有进展
      movement_time_allowance: 30.0      # 允许因行人/窄通道短暂停滞的时间，s

    general_goal_checker:
      stateful: True                     # 到点后保持状态，减少振荡
      plugin: "nav2_controller::SimpleGoalChecker"
      # 到点容差收紧：xy 0.35->0.10 m、yaw 0.15->0.05 rad，改善“到达目标点后旋转过头/停不准”
      xy_goal_tolerance: 0.20            # 平面位置容差，m
      yaw_goal_tolerance: 0.05           # 朝向容差，rad

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController" # MPPI 局部轨迹优化控制器
      time_steps: 40                     # 采样轨迹步数，40*0.05=2s 预测窗口
      model_dt: 0.05                     # 单步预测时间，s
      batch_size: 2000                   # 每轮采样轨迹数量，越大越稳但越吃 CPU
      iteration_count: 1                 # 每个控制周期优化迭代次数
      vx_std: 0.20                       # 前进速度采样标准差，增大后更容易采到正常前进轨迹
      vy_std: 0.0                        # 差速底盘不采样横向速度
      wz_std: 0.45                       # 角速度采样标准差，提高绕障反应
      vx_max: 0.3                        # 最大前进速度，m/s
      vx_min: 0.0                        # 导航跟踪阶段不主动倒车
      vy_max: 0.0                        # 差速底盘横向速度上限
      wz_max: 1.0                        # 最大角速度，rad/s
      ax_max: 0.7                        # 最大前向加速度
      ax_min: -1.0                       # 最大前向减速度
      ay_max: 0.0                        # 差速底盘无横向加速度
      ay_min: 0.0                        # 差速底盘无横向减速度
      az_max: 1.5                        # 最大角加速度
      temperature: 0.3                   # 轨迹选择温度，越小越偏向最优轨迹
      gamma: 0.015                       # 控制能量权重
      motion_model: "DiffDrive"          # 差速运动模型
      visualize: false                   # 实机默认关闭轨迹可视化，降低 CPU 占用
      regenerate_noises: true            # 每轮重新生成采样噪声
      retry_attempt_limit: 2             # 本周期无可行轨迹时允许重试次数
      prune_distance: 1.5                # 裁剪已走过路径的距离，m
      transform_tolerance: 0.1           # TF 容忍延迟，s
      TrajectoryVisualizer:
        trajectory_step: 5               # 开启 visualize 后每隔多少条轨迹显示一次
        time_step: 3                     # 开启 visualize 后每隔多少时间步显示一次
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
          "VelocityDeadbandCritic",
          "TwirlingCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0                 # 约束超限惩罚
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.5                 # 障碍代价权重，降低远距离障碍导致的龟速
        critical_cost: 300.0             # 接近致命障碍的高代价阈值
        near_collision_cost: 253         # 近距离碰撞风险惩罚，MPPI 这里要求整数类型
        collision_cost: 1000000.0        # 碰撞轨迹惩罚
        consider_footprint: false        # 使用 robot_radius 的圆形底盘模型
        near_goal_distance: 0.8          # 近目标时降低障碍代价影响的距离
        trajectory_point_step: 1         # 每个轨迹点都检查代价，提高对障碍的反应速度
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0                 # 靠近目标点的权重
        threshold_to_consider: 1.2       # 距目标小于该值后重点考虑到点
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0                 # 目标朝向权重
        threshold_to_consider: 0.5       # 距目标较近时再重点对齐朝向
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0                 # 贴合全局路径权重，降低后更愿意局部绕人
        max_path_occupancy_ratio: 0.05   # 路径附近占用过高时降低强制贴线
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 8
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0                # 沿路径前进的权重，提高后减少低速磨蹭
        offset_from_furthest: 12
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0                 # 轨迹朝向与路径方向一致性
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0                          # 只按前进方向评估，不鼓励倒车跟踪
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0                 # 偏好前进
        threshold_to_consider: 0.5
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 18.0                # 避免输出底盘难以执行的极小速度
        deadband_velocities: [0.10, 0.0, 0.0]
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0                 # 抑制不必要原地打转

# 局部代价地图：滚动窗口，服务于局部避障与控制
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0             # 更新频率，Hz，提高动态障碍响应
      publish_frequency: 10.0            # 发布频率，Hz
      global_frame: odom                 # 局部图挂在 odom 下，避免 map 抖动影响控制
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5                           # 局部地图宽度，m
      height: 5                          # 局部地图高度，m
      resolution: 0.05                  # 分辨率，m/cell
      # 改为圆形底盘模型：由 robot_radius 决定碰撞轮廓
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0         # 膨胀代价衰减速度，窄空间中让远距离代价衰减更快
        inflation_radius: 0.32           # 局部障碍膨胀半径，给动态障碍更早的代价梯度
      obstacle_layer:
        # 本地障碍物输入统一来自 /scan
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True # 清除机器人足迹内部障碍
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          observation_persistence: 0.3   # 临时障碍短暂保留，兼顾 RViz 显示和动态避障稳定性
          tf_filter_tolerance: 0.3
          marking: True
          clearing: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      always_send_full_costmap: True     # 始终发布完整 costmap

# 全局代价地图：静态地图 + 实时障碍
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0              # 全局图更新频率通常低于局部图
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true          # 保留未知区域
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        # 全局图同样使用 /scan 作为实时障碍输入
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        min_obstacle_height: -1.0
        max_obstacle_height: 2.0
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          observation_persistence: 0.0   # 全局图不额外滞留临时障碍，避免把窄通道封死
          marking: True
          clearing: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True  # 兼容 map_server 的 transient_local QoS
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0         # 膨胀代价衰减速度
        inflation_radius: 0.38           # 全局膨胀半径，保留绕行意图但不过度封窄通道
      always_send_full_costmap: True

# 地图保存器：运行时保存地图
map_saver:
  ros__parameters:
    save_map_timeout: 5.0                # 保存地图超时，s
    free_thresh_default: 0.25            # 自由空间阈值
    occupied_thresh_default: 0.65        # 占用空间阈值
    map_subscribe_transient_local: True

# 全局规划器：依据全局代价地图求路径
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0      # 期望规划频率，Hz，用于诊断规划器是否过慢
    planner_plugins: ["GridBased"]       # 注册的全局规划器插件名列表
    costmap_update_timeout: 1.0          # 规划前等待 global_costmap 更新的超时时间，s
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"  # 使用 NavFn 栅格全局规划器
      tolerance: 0.5                     # 目标点附近允许落到最近可达点的距离，m
      use_astar: false                   # false 为 Dijkstra，true 为 A*
      allow_unknown: false               # 是否允许路径穿越未知区域

# 平滑器：对规划路径做轻量平滑
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# 恢复行为服务器：负责原地转向、后退、等待等恢复动作
#
# 当前策略：使用自定义 BT 保留恢复流程，但删除 BackUp 节点，并把原地旋转速度调低。
# 这里仍保留 backup 插件注册，方便后续手动调试或切回默认 BT；当前自定义 BT 不会调用它。
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame:  odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.35             # 恢复原地转最大角速度，rad/s；默认 1.0，实机更温和
    min_rotational_vel: 0.15             # 恢复原地转最小角速度，rad/s；过低可能转不动
    rotational_acc_lim: 0.8              # 恢复原地转角加速度限制，rad/s^2；降低突变

# 路点跟随器：用于多目标点导航
waypoint_follower:
  ros__parameters:
    loop_rate: 20                        # 路点处理循环频率，Hz
    stop_on_failure: false               # 单点失败后是否整体终止
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200       # 到点后停留时间，ms

# 速度平滑器：对控制器输出速度做限幅与滤波
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0            # 平滑频率，Hz
    scale_velocities: False
    feedback: "OPEN_LOOP"                # 开环速度平滑
    max_velocity: [0.3, 0.0, 1.0]        # 最大速度 [vx, vy, wz]
    min_velocity: [0.0, 0.0, -1.0]       # 最小速度 [vx, vy, wz]；vx=0.0 作为额外安全阀，禁止向后输出
    max_accel: [0.7, 0.0, 1.5]           # 最大加速度，匹配 MPPI 输出能力
    max_decel: [-1.0, 0.0, -2.0]         # 最大减速度，提高遇障碍时的收速反应
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]   # 死区速度
    velocity_timeout: 1.0                # 超时未收到速度则置零

# 碰撞监视器：控制链末端的最后一道安全限制
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: "cmd_vel_smoothed" # 输入为速度平滑器输出
    cmd_vel_out_topic: "cmd_vel_safe"    # 最终安全速度输出，供底盘控制节点订阅
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.8
      simulation_time_step: 0.05
      min_points: 8
      visualize: False
      enabled: True
    observation_sources: ["obstacle_points"]
    obstacle_points:
      # 保持与 costmap 一致，统一消费 /scan
      type: "scan"
      topic: /scan
      enabled: True

# 停靠服务：当前沿用模板参数
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

# loopback_simulator：保留 Nav2 自带测试/模拟接口所需参数
loopback_simulator:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    map_frame_id: map
    # 这里使用 3D 雷达安装帧
    scan_frame_id: "lidar_3d_link"
    update_duration: 0.02
