qr_docking_node:
  ros__parameters:
    # 目标停靠距离（米）：机器人与充电桩标签的期望最终距离
    target_distance: -0.455
    # 横向误差容忍（米）：|y 方向偏差| 小于该值视为对齐
    # 放宽到 0.05：倒车对接的横向-航向耦合使横向收敛到~4cm 就接近极限，
    # 0.03 过紧导致判定差一点进不了; 0.05 可让到位判定稳定通过。
    horizontal_tolerance: 0.05
    # 角度误差容忍（弧度）：|偏航误差| 小于该值视为朝向对齐
    angular_tolerance: 0.15
    # 线速度上限（米/秒）：前进/后退控制最大速度
    linear_max_speed: 0.1
    # 角速度上限（弧度/秒）：转向控制最大速度
    angular_max_speed: 0.2
    # 丢失标签后的搜索角速度（弧度/秒）
    search_angular_speed: 0.25

    # ================= 三段式对接几何 =================
    # 第一阶段 LATERAL_ALIGNING：在 tag 前 lateral_align_distance 米处完成横向(y)调整，
    # 到位后驻留直到横向误差进入容差。
    lateral_align_distance: 1.0
    # 第二阶段 -> 第三阶段边界：PID 抵近到 tag 前 angular_align_distance 米后，
    # 转入第三阶段，在该位置调整自身航向(yaw)到容差内，到达充电位置。
    # 注：最终停靠距离仍由 target_distance 决定（angular_align_distance 略大于
    # |target_distance|，用于在最后几厘米完成航向对齐）。
    angular_align_distance: 0.5
    # 第一阶段横向调整时的线速度上限（米/秒）：向 1 米位置靠近要慢，留足横向纠偏时间。
    lateral_align_linear_max_speed: 0.06
    # 第三阶段航向对齐时的线速度上限（米/秒）：只允许极小的距离补偿，避免带歪航向。
    angular_align_linear_max_speed: 0.03

    # 线速度 PID 参数（距离误差 -> 线速度）
    # 用户方向：清积分、纯 P，让前进/后退响应快、积极把机器人挪到 tag 正前方。
    linear_kp: 0.8
    linear_ki: 0.0
    linear_kd: 0.0
    # 角速度控制（第三阶段 ANGULAR_ALIGNING）
    # 航向项增益 kh（w = -klat*bearing + kh*yaw）。过大时航向项饱和、把横向带飞；
    # 仿真验证 0.8 可让横向与航向同时进容差。
    angular_kp: 0.8
    # 倒车弧线（第一阶段横向、第二阶段抵近）的前视距离：沿弧线把横向归零并自然对正航向。
    pp_lookahead: 1.0
    # 航向测量低通滤波系数（0~1，越大越跟随原始测量）：
    # 抑制 6cm 标签姿态在远距离处的估测抖动，避免控制器追逐噪声。
    angular_error_alpha: 0.4

    # 线速度 PID 积分项限幅（防积分饱和）
    linear_error_sum_max: 1.0

    # 单次对接最大时长（秒），超时后退出本次流程
    max_docking_duration_sec: 120.0
    # 标签数据超时（秒）：超过该时间未收到新标签数据视为超时
    tag_timeout_sec: 2.0
    # 标签连续丢失最大时长（秒）：超过后触发失败/重试逻辑
    max_tag_lost_sec: 10.0
    # 对接开始后的 tag 启动宽限时间（秒）：识别节点起步阶段不因无 tag 判失败
    tag_startup_grace_sec: 5.0
    # 最大重试次数：超过后对接任务失败
    max_retry_count: 5
    # 完成判定稳定周期数：连续满足到位条件 N 个控制周期才算成功
    done_stable_cycles: 8
    # 成功/退出前额外发布 0 速度的次数，确保底盘稳定停车
    stop_publish_count: 5

    # 触发重试的距离误差阈值（米）
    retry_threshold: 0.5
    # 重试机动持续时间（秒）：时长过大会导致前进/后退重试动作过长
    retreat_duration_sec: 5.0
    # 重试后退速度（米/秒）
    retreat_speed: 0.1
    # 重试时角速度放大系数：压到极小，让重退专心纠横向、不再用航向项抵消横向修正
    retreat_angular_factor: 0.15
    # 重试时横向修正放大系数：加大，让重退在"远离标签"时把横向真正归零
    retreat_lateral_factor: 2.0
    # 低速僵持判定线速度阈值（米/秒）：横向误差仍大且线速度低于该值会触发重试
    retry_stall_linear_speed_threshold: 0.01
    # 连续僵持周期数（控制周期个数）达到后触发下一次前进重试
    retry_stall_cycles: 8
    # 第二阶段最终靠近窗口（米）：进入该窗口后启用更低线速度上限
    final_approach_distance_window: 0.6
    # 第二阶段最终靠近线速度上限（米/秒）
    final_approach_linear_max_speed: 0.05
    # 第三阶段 ANGULAR_ALIGNING 横向项增益 klat（w = -klat*bearing + kh*yaw）
    lateral_direct_k: 1.0

    # 机器人基坐标系（TF frame）
    base_frame: "base_link"
    # 充电桩标签坐标系（TF frame）
    tag_frame: "dock_frame"
    # 控制周期（秒）：控制循环执行间隔
    control_period: 0.1
    # 当前偏差发布话题（Vector3Stamped: x=dx, y=dy, z=dyaw）
    error_topic: "/docking/current_error"
    # 偏差发布频率（Hz）
    error_publish_hz: 20.0
    # 结束对接后再次开始的最短间隔（秒），与 charge_services 保持一致
    docking_restart_cooldown_sec: 5.0
    # 对接状态发布频率（Hz），供上层 action 反馈订阅
    state_publish_hz: 2.0
    # 终态（DOCKING_COMPLETED 等）保持时长（秒），避免上层错过单次发布
    terminal_state_hold_sec: 3.0

charge_services:
  ros__parameters:
    # dock action / service 名称
    dock_action_name: dock
    # 充电状态查询超时（秒）
    state_timeout_sec: 5.0
    # dock(start=true) 阻塞等待 DOCKING_COMPLETED 的最长时间（秒）
    docking_completion_timeout_sec: 120.0
    # 两次对接之间的最短间隔（秒）：结束对接后需等待该时间才能再次开始，避免节点未完全退出
    docking_session_cooldown_sec: 5.0
