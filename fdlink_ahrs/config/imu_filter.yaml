imu_filter:
  ros__parameters:
    # fdlink_ahrs publishes raw IMU on /imu without a separate magnetometer topic
    use_mag: false
    stateless: false
    publish_tf: false
    reverse_tf: false
    fixed_frame: "odom"
    constant_dt: 0.0
    publish_debug_topics: false
    world_frame: "enu"
    gain: 0.1
    zeta: 0.0
    mag_bias_x: 0.0
    mag_bias_y: 0.0
    mag_bias_z: 0.0
    orientation_stddev: 0.0
    remove_gravity_vector: false

imu_throttle:
  ros__parameters:
    output_rate_hz: 200.0
