/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 2
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "/home/medical/rs_lidar/src/FAST_LIO/PCD/rslidar_map.pcd"

        common:
            lid_topic:  "/rslidar_points"
            imu_topic:  "/rslidar_imu_data"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 5                # RoboSense PointCloud2 with x,y,z,intensity,ring,timestamp
            scan_line: 5
            scan_rate: 10
            timestamp_unit: 0
            blind: 0.2

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 120.0
            det_range: 20.0

            extrinsic_est_en:  false
            extrinsic_T: [ 0.0042744, -0.0157518, 0.0042744 ]
            extrinsic_R: [0.0, -1.0, -0.0,
                          0.0, 1.0, 1.0,
                          -1.0, 0.0, 0.0]

        publish:
            path_en: true
            map_en: true
            scan_publish_en: true
            dense_publish_en: true
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: true
            interval: 100
